name: CI

# No deployment step. OCI credentials are not configured for this repository,
# and Program001 does not add a deploy that cannot be verified here.
on:
  push:
    # Every program branch, not an enumerated list: Program002 pushed to a
    # branch this workflow did not watch and ran nothing at all, which looks
    # exactly like a passing build until you go looking for the run.
    branches: ["main", "program*/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # The production dialect. The suite can fall back to SQLite locally,
        # but CI always runs against PostgreSQL.
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adaptive_test
          POSTGRES_USER: adaptive
          POSTGRES_PASSWORD: adaptive
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adaptive -d adaptive_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://adaptive:adaptive@localhost:5432/adaptive_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        working-directory: backend
        run: mypy

      - name: Validate knowledge and compliance YAML
        working-directory: backend
        run: |
          python - <<'PY'
          from pathlib import Path

          import yaml

          from app.domain.practice.catalog import KNOWLEDGE_VERSIONS, load_catalog

          # Every version, not just the current one: v1 is the comparator
          # baseline and the replay fixture, and must stay loadable.
          for version in KNOWLEDGE_VERSIONS:
              catalog = load_catalog(Path("../knowledge"), version)
              print(f"knowledge v{version} ok: {len(catalog.practices)} practices, "
                    f"{len(catalog.protocols_by_practice)} protocols")

          for path in sorted(Path("../compliance").glob("*.yaml")):
              with path.open(encoding="utf-8") as handle:
                  yaml.safe_load(handle)
              print(f"compliance ok: {path.name}")
          PY

      - name: Compliance consistency
        run: python scripts/check_compliance_consistency.py
        working-directory: ${{ github.workspace }}

      - name: Audio assets are generated, not imported
        working-directory: ${{ github.workspace }}
        run: |
          # Regenerates the bells and compares them byte for byte against what
          # is committed. A swapped file, an imported sample, or a manifest that
          # no longer matches its generator all fail here - which is the point:
          # audio with unclear provenance must not reach a store build.
          python scripts/generate_bells.py --check

      - name: Compare rule sets
        working-directory: backend
        run: |
          # The offline comparator must run, and its diff must stay inside the
          # transitions declared in docs/SDD_PROGRAM002.md section 2.23. The
          # assertion itself lives in tests/test_comparator.py; this step proves
          # the script is runnable as a script, with no network.
          python scripts/compare_rulesets.py --baseline v1 --candidate v2 --quick

      - name: Validate the OpenAPI document
        working-directory: backend
        run: |
          python scripts/export_openapi.py --check
          python - <<'PY'
          from pathlib import Path

          import yaml
          from openapi_spec_validator import validate

          document = yaml.safe_load(
              Path("../api/openapi.v1.yaml").read_text(encoding="utf-8")
          )
          validate(document)
          print(f"openapi ok: {len(document['paths'])} paths")
          PY

      - name: Run the migrations against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          # upgrade -> downgrade one step -> upgrade, so each revision is
          # exercised in both directions, not just the head state.
          alembic upgrade head
          alembic downgrade 0001
          alembic upgrade head
          alembic downgrade base

      - name: Tests
        working-directory: backend
        run: pytest -v

      - name: Performance budgets
        working-directory: backend
        env:
          # Both, and deliberately: alembic reads DATABASE_URL while the
          # benchmark reads TEST_DATABASE_URL. Setting only one lets alembic
          # fall through to its default database, which does not exist here.
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          # A shared CI runner is not a benchmark environment, so these numbers
          # are never reported as performance figures. The step exists to catch
          # an order-of-magnitude regression - a path that starts doing a query
          # per segment, say - which is visible even through runner noise. The
          # budgets it checks have roughly two orders of magnitude of headroom
          # locally, so runner variance alone cannot fail it.
          alembic upgrade head
          python scripts/benchmark_paths.py --runs 30

  android-store-readiness:
    name: Android store readiness
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Static checks (target API, permissions, cleartext)
        run: python3 scripts/check_android_store_readiness.py

      - name: Build the release app bundle
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build appbundle --release

      - name: Audit the merged release manifest
        run: |
          # The source manifest cannot see a permission contributed by a plugin;
          # only the merged one can, which is why this runs after the build.
          MANIFEST=apps/mobile/build/app/intermediates/packaged_manifests/release/processReleaseManifestForPackage/AndroidManifest.xml
          test -f "$MANIFEST" || {
            echo "merged manifest not found at $MANIFEST"; exit 1; }
          python3 scripts/check_android_store_readiness.py --merged-manifest "$MANIFEST"

      - name: Confirm the bundle exists
        run: |
          AAB=apps/mobile/build/app/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "no app bundle produced"; exit 1; }
          echo "app bundle: $(du -h "$AAB" | cut -f1)"

  ios-store-readiness:
    name: iOS store readiness
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate the privacy manifest
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("apps/mobile/ios/Runner/PrivacyInfo.xcprivacy")
          with path.open("rb") as handle:
              manifest = plistlib.load(handle)
          assert manifest["NSPrivacyTracking"] is False, "tracking must be false"
          types = {
              entry["NSPrivacyCollectedDataType"]
              for entry in manifest["NSPrivacyCollectedDataTypes"]
          }
          assert "NSPrivacyCollectedDataTypeHealthFitness" not in types, (
              "HealthKit is not enabled; the category must not be declared"
          )
          print(f"privacy manifest ok: {len(types)} data types")
          PY

      - name: Install checker dependencies
        # The compliance checker needs PyYAML. The macOS runner's system python
        # does not ship it, which failed this job on its first run - depending
        # on what an image happens to include is not a dependency declaration.
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Privacy manifest audit is consistent
        run: python3 scripts/check_compliance_consistency.py

      - name: Build for device without signing
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build ios --release --no-codesign

      - name: Confirm the manifest is embedded in the app bundle
        working-directory: apps/mobile
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          test -n "$APP" || { echo "no .app produced"; exit 1; }
          test -f "$APP/PrivacyInfo.xcprivacy" || {
            echo "PrivacyInfo.xcprivacy is not in the built bundle"; exit 1; }
          echo "privacy manifest embedded in $(basename "$APP")"

      - name: No prohibited entitlement or permission string
        working-directory: apps/mobile
        run: |
          APP=$(find build/ios/iphoneos -maxdepth 1 -name "*.app" | head -1)
          for key in NSCameraUsageDescription NSMicrophoneUsageDescription \
                     NSLocationWhenInUseUsageDescription NSHealthShareUsageDescription \
                     NSHealthUpdateUsageDescription NSContactsUsageDescription; do
            if plutil -p "$APP/Info.plist" | grep -q "$key"; then
              echo "prohibited permission string in the built app: $key"; exit 1
            fi
          done
          echo "no prohibited permission strings"

  docker:
    name: Backend image (linux/arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Build for the OCI Ampere A1 target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  mobile:
    name: Flutter (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

  secrets:
    name: No committed credential
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checker dependencies
        run: python3 -m pip install --break-system-packages pyyaml

      - name: Scan the tracked tree for credential shapes
        run: python3 scripts/check_committed_secrets.py

      - name: Store release gate (informational)
        # Never fails the build. It reports whether submission is possible, and
        # a missing brand name must not block a pull request.
        continue-on-error: true
        run: python3 scripts/store_release_gate.py
