      description: One row of a guest's history.
      properties:
        completed_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Completed At
        created_at:
          format: date-time
          title: Created At
          type: string
        duration_minutes:
          title: Duration Minutes
          type: integer
        id:
          format: uuid
          title: Id
          type: string
        outcome_score:
          anyOf:
          - type: integer
          - type: 'null'
          title: Outcome Score
        practice_id:
          title: Practice Id
          type: string
        public_title:
          title: Public Title
          type: string
        rule_set_version:
          anyOf:
          - type: string
          - type: 'null'
          title: Rule Set Version
        status:
          title: Status
          type: string
      required:
      - id
      - status
      - created_at
      - completed_at
      - practice_id
      - public_title
      - duration_minutes
      - rule_set_version
      - outcome_score
      title: SessionSummary
      type: object
    TimelineSegmentResponse:
      additionalProperties: false
      description: 'One segment of the executable timeline.


        ``transcript`` is present on every speech segment, so a client can run the

        whole session as text - which is how a user who cannot use audio completes

        one, not a degraded fallback.'
      properties:
        asset_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Asset Key
        bell_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Bell Id
        duration_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Duration Ms
        elastic:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Elastic
        estimated_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Estimated Ms
        id:
          title: Id
          type: string
        kind:
          title: Kind
          type: string
        marker_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Marker Id
        min_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Ms
        render_key:
          anyOf:
          - type: string
          - type: 'null'
          title: Render Key
        target_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Target Ms
        text:
          anyOf:
          - type: string
          - type: 'null'
          title: Text
        transcript:
          anyOf:
          - type: string
          - type: 'null'
          title: Transcript
      required:
      - kind
      - id
      title: TimelineSegmentResponse
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: 'Adaptive Meditation Program001 vertical slice: check-in, deterministic practice recommendation,
    session protocol and outcome feedback. Wellness product; it does not diagnose or treat any condition.'
  title: Adaptive Meditation API
  version: 0.1.0
openapi: 3.1.0
paths:
  /delete-account:
    get:
      operationId: deleteAccountInfo
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Delete Account
      tags:
      - system
  /healthz:
    get:
      description: 'Reports the versions actually serving traffic.


        Program001 reported a single ``rules_version`` taken from a module constant,

        which kept saying "1" after the engine moved to rule set 2. Reading the

        values off the live engine and catalog means the endpoint cannot drift from

        what is running.'
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /privacy:
    get:
      operationId: privacyPolicy
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Privacy
      tags:
      - system
  /privacy-choices:
    get:
      description: The URL Apple's User Privacy Choices field points at.
      operationId: privacyChoices
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Privacy Choices Page
      tags:
      - system
  /support:
    get:
      operationId: support
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Support
      tags:
      - system
  /terms:
    get:
      operationId: termsOfUse
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Terms
      tags:
      - system
  /v1/check-ins:
    post:
      description: 'Guest-first: no account is required and no user identity is created.


        A guest id, if sent, is recorded so the caller can find and delete this data

        later. Without one the check-in is still accepted; it simply has no owner.'
      operationId: createCheckIn
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Record a current-state check-in
      tags:
      - v1
  /v1/disclaimer:
    get:
      description: 'Served to the client so the wording lives in one place.


        One surface, shown once. A warning repeated on every screen stops being read,

        which makes the product worse without making it safer.'
      operationId: wellnessDisclaimer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisclaimerResponse'
          description: Successful Response
      summary: The one wellness disclaimer surface
      tags:
      - system
      - v1
  /v1/experiments/exposures:
    post:
      description: 'Exposure, as distinct from assignment.


        Idempotent per context, so re-opening the same screen does not double-count.

        ``recorded`` says whether this call created the exposure or found one.'
      operationId: recordExperimentExposure
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExposureRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExposureResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Record that an experiment variant was actually shown
      tags:
      - v1
  /v1/me/data:
    delete:
      description: 'Deletes the guest row; the database cascades to everything else.


        One statement rather than a list of tables, so a table added later cannot be

        forgotten here.'
      operationId: deleteGuestData
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown guest
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete everything stored for this guest
      tags:
      - guest
  /v1/me/export:
    get:
      operationId: exportGuestData
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestExportResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown guest
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Everything stored for this guest
      tags:
      - guest
  /v1/recommendations:
    post:
      description: 'The recommendation itself is pure computation.


        A session is opened only to record the presentation-experiment assignment,

        and only when the caller sent a guest identity. Without one this endpoint

        still touches no database at all, which is what keeps it answerable with the

        database down.'
      operationId: createRecommendation
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Deterministic practice recommendation
      tags:
      - v1
  /v1/recommendations/candidates:
    post:
      description: 'Not part of the normal client flow.


        The ordinary recommendation endpoint returns the winner only; this exposes

        the ranking behind it for offline evaluation. Scores are ordinal ranking

        aids, not probabilities.'
      operationId: createRecommendationCandidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Full scored candidate list (debug and offline evaluation)
      tags:
      - v1
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Create a session from a stored check-in
      tags:
      - v1
  /v1/sessions/history:
    get:
      operationId: listSessionHistory
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryPage'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: This guest's past sessions, newest first
      tags:
      - guest
  /v1/sessions/{session_id}:
    get:
      operationId: getSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Read a session, including its recovery point
      tags:
      - v1
  /v1/sessions/{session_id}/events:
    post:
      description: 'Batched so a session does not make a round trip per segment.


        Idempotent per (session, sequence): a client that retries after losing its

        connection re-sends the batch and gets the same journal, not a doubled one.'
      operationId: appendSessionEvents
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionEventBatchRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionEventBatchResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Append playback events
      tags:
      - v1
  /v1/sessions/{session_id}/feedback:
    post:
      operationId: submitSessionFeedback
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFeedbackRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Attach before/after feedback to a session
      tags:
      - v1
  /v1/sessions/{session_id}/playback:
    get:
      description: What a client asks for after being killed in the background.
      operationId: getPlaybackState
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Read playback state and the recovery point
      tags:
      - v1
    post:
      description: 'Drive the run state machine.


        A replayed sequence, an out-of-order sequence and a command on a finished

        run all return the current state with ``applied=false``. Two things are a

        409: an illegal transition - starting a session that was never prepared -

        and a sequence the journal already holds.'
      operationId: applyPlaybackCommand
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackCommandRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackStateResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Apply a playback command
      tags:
      - v1
  /v1/sessions/{session_id}/prepare:
    post:
      description: 'Build the render manifest for a session''s speech segments.


        Cache first, renderer only on a miss, which is what makes synthesis a

        one-off cost rather than a per-session one. With no server-side renderer

        configured - the shipping default - every segment comes back unresolved and

        the client speaks them with device-native TTS.'
      operationId: prepareSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderManifestResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Resolve the audio a session needs
      tags:
      - v1
  /v1/sessions/{session_id}/resolution:
    post:
      description: 'Validate and store a device-computed resolution.


        The server recomputes the hash from the content and validates the content

        against the frozen plan - segment identity and order, silence floors,

        versions, and whether an audible mode actually has audio hashes. Checking

        that numbers are non-negative would not be validation; a tampered or buggy

        client can produce a perfectly non-negative lie.'
      operationId: recordSessionResolution
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResolutionRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResolutionResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Record the resolution a device computed
      tags:
      - v1
  /v1/sessions/{session_id}/start:
    post:
      operationId: startSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mark a session as started
      tags:
      - v1
