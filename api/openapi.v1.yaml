info:
  description: 'Adaptive Meditation Program001 vertical slice: check-in, deterministic practice recommendation,
    session protocol and outcome feedback. Wellness product; it does not diagnose or treat any condition.'
  title: Adaptive Meditation API
  version: 0.1.0
openapi: 3.1.0
paths:
  /delete-account:
    get:
      operationId: deleteAccountInfo
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Delete Account
      tags:
      - system
  /healthz:
    get:
      operationId: healthz
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
      tags:
      - system
  /privacy:
    get:
      operationId: privacyPolicy
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Privacy
      tags:
      - system
  /support:
    get:
      operationId: support
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Support
      tags:
      - system
  /terms:
    get:
      operationId: termsOfUse
      responses:
        '200':
          content:
            text/html:
              schema:
                type: string
          description: Successful Response
      summary: Terms
      tags:
      - system
  /v1/check-ins:
    post:
      description: 'Guest-first: no account is required and no user identity is created.


        A guest id, if sent, is recorded so the caller can find and delete this data

        later. Without one the check-in is still accepted; it simply has no owner.'
      operationId: createCheckIn
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Record a current-state check-in
      tags:
      - v1
  /v1/me/data:
    delete:
      description: 'Deletes the guest row; the database cascades to everything else.


        One statement rather than a list of tables, so a table added later cannot be

        forgotten here.'
      operationId: deleteGuestData
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown guest
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete everything stored for this guest
      tags:
      - guest
  /v1/me/export:
    get:
      operationId: exportGuestData
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestExportResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unknown guest
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Everything stored for this guest
      tags:
      - guest
  /v1/recommendations:
    post:
      description: Pure computation. Deliberately does not touch the database.
      operationId: createRecommendation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Deterministic practice recommendation
      tags:
      - v1
  /v1/recommendations/candidates:
    post:
      description: 'Not part of the normal client flow.


        The ordinary recommendation endpoint returns the winner only; this exposes

        the ranking behind it for offline evaluation. Scores are ordinal ranking

        aids, not probabilities.'
      operationId: createRecommendationCandidates
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckIn'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Full scored candidate list (debug and offline evaluation)
      tags:
      - v1
  /v1/sessions:
    post:
      operationId: createSession
      parameters:
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflicting state
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Create a session from a stored check-in
      tags:
      - v1
  /v1/sessions/history:
    get:
      operationId: listSessionHistory
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: cursor
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursor
      - in: header
        name: X-Guest-Id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Guest-Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionHistoryPage'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Guest identity required
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: This guest's past sessions, newest first
      tags:
      - guest
  /v1/sessions/{session_id}/feedback:
    post:
      operationId: submitSessionFeedback
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionFeedbackRequest'
        required: true
      responses:
        '204':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Validation error
      summary: Attach before/after feedback to a session
      tags:
      - v1
  /v1/sessions/{session_id}/start:
    post:
      operationId: startSession
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          format: uuid
          title: Session Id
          type: string
      responses:
        '204':
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Resource not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mark a session as started
      tags:
      - v1
