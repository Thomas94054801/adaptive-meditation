name: adaptive_meditation
description: Adaptive Meditation - state check-in to a deterministic practice session.
publish_to: "none"

# The product identity is deliberately separate from the legal owner identity so
# a later move from an individual publisher to a company does not require a
# rewrite. Bundle identifiers are set per platform, not derived from a name here.
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.1.0
  http: ^1.2.2

  # Program004R audio stack. Chosen in SDD section 5.2; the lockfile, not the
  # constraint here, is the authority on what is actually resolved.
  #
  # The player and the background/media-session runtime are plugins because a
  # first-party Android foreground service and iOS remote-command
  # implementation fails in the way nobody catches without a device farm:
  # playback dying silently in someone's pocket.
  just_audio: ^0.10.0
  audio_service: ^0.18.0
  audio_session: ^0.2.0
  # Synthesis to a file at prepare time. Playback is always from a verified
  # local file, never from a live synthesiser.
  flutter_tts: ^4.2.0
  # Durable local store. Transactional and crash-consistent; an in-memory list
  # is explicitly not an acceptable substitute (SDD A5).
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  # Content-addressed hashing of synthesised bytes, matching the backend.
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  # Runs the real SQLite engine on the host, so the durable store's schema,
  # transactions and quota behaviour are tested against actual SQL rather than
  # against a mock that cannot disagree with it. Dev-only: production uses
  # sqflite's platform implementation.
  sqflite_common_ffi: ^2.3.0
  flutter_lints: ^6.0.0
  yaml: ^3.1.4

flutter:
  uses-material-design: true
  assets:
    # Generated by scripts/generate_bells.py, hash-pinned in
    # assets/audio/PROVENANCE.json, and verified byte-for-byte in CI. Declared
    # here because a file in the repository that is not bundled cannot be
    # played - which is exactly what Program004 shipped.
    - assets/audio/bells/
    # The source every silence segment is clipped out of. Silence has to be
    # real media so the native pipeline schedules it and reports completion;
    # just_audio's SilenceAudioSource is Android-only, so a clipped asset is
    # the cross-platform mechanism.
    - assets/audio/silence/
