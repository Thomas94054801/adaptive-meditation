# Third-party SDK inventory.
#
# One entry per package that ships native code on iOS or Android. Dart-only
# packages cannot reach a platform API and are listed separately for
# completeness rather than audited individually.
#
# The goal is a minimal SDK surface. No package is added for analytics
# convenience while first-party telemetry suffices.
#
# Program004R adds six packages, and the reason is the one Program004 got
# wrong: it added none and shipped an app that could not make a sound. A
# first-party Android media foreground service and iOS remote-command
# implementation concentrate the cost in exactly the area that fails silently
# in a user's pocket and cannot be caught without a device farm. Versions below
# are what the resolver actually produced; pubspec.lock is the authority.
#
# None of these packages performs analytics or contacts a network service of
# its own on the paths this app enables. That is a statement about enabled
# paths, not an inference from "no analytics": just_audio can stream from a URL
# and cache remotely, and this app never gives it a remote URL - playback
# sources are restricted to verified local file and asset URIs.
schema_version: 1
program: Program004R
audited_on: "2026-09-12"

prohibited_in_v1:
  # Not "not currently used" - actively disallowed. Each of these would change
  # the Apple privacy disclosure and the Play Data Safety answers, and none is
  # needed for a meditation app to work.
  - meta_sdk
  - facebook_app_events
  - advertising_attribution_sdk
  - behavioral_advertising_sdk
  - device_fingerprinting_sdk
  - idfa_or_gaid_collection

sdks:
  - package: just_audio
    version: "0.10.6"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: capable_but_unused
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: >-
      Plays the verified local audio files a session prepared. Constructed with
      handleInterruptions:false and handleAudioSessionActivation:false so this
      app owns interruption policy and session activation - the plugin's
      default is to resume after an interruption, which for a meditation means
      a voice starting the instant a phone call ends.
    network_note: >-
      The package supports remote URLs, proxy stream sources and a caching
      audio source. None is used: this app passes only file: and asset: URIs,
      and no global cleartext or ATS relaxation is added.

  - package: audio_service
    version: "0.18.19"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: capable_but_unused
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: >-
      Background playback, media session, lock-screen controls and the Android
      media-playback foreground service. Owns no product rules.
    network_note: >-
      Remote artwork is not used; notification artwork, if any, comes from a
      bundled asset.

  - package: audio_session
    version: "0.2.4"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: >-
      Audio focus, session category and route-change events. The single owner
      of activation; the player defers to it.

  - package: flutter_tts
    version: "4.2.5"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: os_dependent
    required_reason_api: false
    privacy_manifest_present: false
    tracking: false
    purpose: >-
      Synthesises approved guidance text to a local file at prepare time. Never
      used for live playback, so a session's duration is known before it starts.
    network_note: >-
      The package itself makes no network call. The Android system TTS engine
      it delegates to may synthesise over the network depending on the user's
      configured engine; that is an OS behaviour outside this app's control and
      unobservable to it, disclosed in the privacy policy as such. No cloud TTS
      vendor is engaged by this app, so no subprocessor is declared.

  - package: sqflite
    version: "2.4.4"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: >-
      The durable local store for playback checkpoints and the unsent outbox.
      Guest-scoped session data, covered by the retention policy and cleared on
      guest deletion.

  - package: path_provider
    version: "2.1.6"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: >-
      Resolves the application-support directory for prepared audio and the
      durable store. Application support rather than cache, because the OS may
      clear a cache directory and a prepared session must stay resumable.

  - package: crypto
    version: "3.0.7"
    ios_native_code: false
    android_native_code: false
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: false
    tracking: false
    purpose: >-
      SHA-256 of synthesised bytes and of the canonical resolution form, so the
      client and the backend can agree on a hash.

  - package: flutter_secure_storage
    version: "11.1.0"
    ios_native_code: false
    android_native_code: true
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: false
    tracking: false
    purpose: >-
      Federated entry point for Keychain and Keystore-backed storage of the
      guest identifier. The Android implementation is in this package; it
      declares no permissions.

  - package: flutter_secure_storage_darwin
    version: "0.4.2"
    ios_native_code: true
    android_native_code: false
    data_collection: none
    network_access: false
    required_reason_api: false
    privacy_manifest_present: true
    tracking: false
    purpose: Keychain implementation for iOS and macOS.

  - package: http
    version: "1.6.0"
    ios_native_code: false
    android_native_code: false
    data_collection: none
    network_access: true
    required_reason_api: false
    privacy_manifest_present: false
    tracking: false
    purpose: >-
      HTTPS calls to this product's own backend only. No third-party endpoint is
      contacted by the client.

runtime:
  - package: flutter
    version: "3.47.3"
    ios_native_code: true
    android_native_code: true
    data_collection: none
    network_access: false
    required_reason_api: true
    required_reason_detail: >-
      The engine declares UserDefaults (CA92.1) in its own bundled privacy
      manifest. It is the runtime, not a third-party SDK chosen for a feature.
    privacy_manifest_present: true
    tracking: false
    purpose: Application runtime.

dart_only_dependencies:
  - args
  - async
  - characters
  - collection
  - crypto
  - meta
  - typed_data
  - vector_math
  - web

removed_in_program003:
  - package: shared_preferences
    removed_because: >-
      Replaced by platform-secure storage. Removing it also removed the app's
      only UserDefaults usage, so the app-level privacy manifest declares no
      Required Reason API at all.

diagnostics_vendors:
  crashlytics: not_integrated
  sentry: not_integrated
  policy: >-
    A third-party diagnostics vendor requires a data-inventory update, an SDK
    audit entry, an Apple privacy update and a Google Data Safety update before
    integration. V1 ships the DiagnosticsProvider interface with a local
    implementation instead.
