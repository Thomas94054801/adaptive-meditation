# Mobile capability declaration for V1.
#
# Anything false here must have no permission string in the iOS Info.plist or
# the Android manifest, and anything true must have one. Store review treats a
# declared-but-unused permission as a defect, and an undeclared-but-used one as
# a worse defect. A permission appears here only once the code creates the fact
# it describes.
schema_version: 1
program: Program004
platform_permissions:
  camera:
    requested: false
    rationale: No posture or facial analysis in V1.
    deferred_to: null
  microphone:
    requested: false
    rationale: Sessions are guided by on-screen text; no audio capture.
    deferred_to: null
  location:
    requested: false
    rationale: Practice selection depends on the self-reported check-in only.
    deferred_to: null
  photo_library:
    requested: false
    rationale: No user media in V1.
    deferred_to: null
  contacts:
    requested: false
    rationale: No social features in V1.
    deferred_to: null
  notifications:
    requested: false
    rationale: >-
      Practice reminders are a Program005 personalization feature. V1 ships no
      notification prompt at all rather than asking for a permission it does not
      yet use.
    deferred_to: Program005
  healthkit:
    requested: false
    rationale: Health integration is out of V1 scope.
    deferred_to: Program008
  health_connect:
    requested: false
    rationale: Health integration is out of V1 scope.
    deferred_to: Program008
  background_refresh:
    requested: false
    rationale: >-
      No background fetch or processing. Background audio is a separate
      capability and is declared below; it does not grant background execution
      for anything other than playing the session that is already running.
    deferred_to: null
  background_audio:
    requested: true
    rationale: >-
      Program004 plays guided audio, and a meditation the user has to keep the
      phone unlocked for is a meditation spent watching a phone. Declared on iOS
      as UIBackgroundModes=audio and on Android as a media-playback foreground
      service. It carries no data collection: nothing is recorded, and the
      microphone is not touched.
    deferred_to: null
    ios_declaration: UIBackgroundModes=audio
    android_declaration: >-
      android.permission.FOREGROUND_SERVICE and
      android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK
store_sensitive_capabilities:
  apple_iap:
    implemented: false
    isolated_behind_adapter: true
    adapter: BillingProvider
    deferred_to: Program006
  google_play_billing:
    implemented: false
    isolated_behind_adapter: true
    adapter: BillingProvider
    deferred_to: Program006
  account_authentication:
    implemented: false
    isolated_behind_adapter: true
    adapter: AuthProvider
    deferred_to: Program003
  push_notifications:
    implemented: false
    isolated_behind_adapter: true
    adapter: NotificationProvider
    deferred_to: Program005
  secure_storage:
    implemented: true
    isolated_behind_adapter: true
    adapter: SecureStorageProvider
    backing_store: platform app-private preferences
    encrypted_at_rest: false
    notes: >-
      Stores one value: a random UUIDv4 guest identifier. It is not a credential
      and carries no health data, so app-private preferences are appropriate.
      This is deliberately not described as keychain storage; a keychain-backed
      implementation of the same interface is the upgrade path if anything
      sensitive is ever stored here.
  text_to_speech:
    implemented: true
    isolated_behind_adapter: true
    adapter: TtsProvider
    provider: device-native
    cloud_subprocessor: false
    offline_capability: local_unconfirmed
    notes: >-
      Device-native synthesis only. No cloud TTS vendor is contacted, so no new
      subprocessor is declared - a subprocessor entry would describe a data flow
      that does not exist. Native is not assumed to be offline: on Android the
      system engine may synthesise over the network and the app cannot observe
      it, so the capability stays local_unconfirmed until a probe with the
      network down says otherwise, and no offline claim is made on that basis.
  background_audio_playback:
    implemented: true
    isolated_behind_adapter: true
    adapter: AudioSessionPort
    notes: >-
      Audio focus, route changes and background playback. Losing headphones to
      a route audible to the room interrupts playback rather than continuing,
      which is a privacy behaviour rather than a convenience one.
guest_usage:
  registration_required: false
  fake_identity_generated: false
  identifier: random UUIDv4 generated on the client
  identifier_sources_prohibited:
    - hardware_fingerprint
    - imei
    - advertising_id
    - idfa
    - idfv
    - mac_address
  server_side_storage: true
  self_service_deletion: "DELETE /v1/me/data"
  self_service_export: "GET /v1/me/export"
  notes: >-
    Check-ins and sessions are created with no account. user_id is nullable in
    the schema and is still never populated. Program002 added server-side guest
    data, and with it real deletion and export: the guest row cascades to
    check-ins, sessions, feedback, recommendation candidates and experiment
    assignments.
claims:
  medical_diagnosis: false
  medical_treatment: false
  advertising_use_of_wellness_data: false
