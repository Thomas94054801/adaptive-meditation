schema_version: 1
product_positioning: wellness
medical_diagnosis: false
medical_treatment_claims: false
individual_first: true
v1:
  identity:
    email:
      collected: optional
      purpose: [account, authentication]
      deletable: true
      advertising_use: false
  identity_guest:
    guest_id:
      collected: true
      form: random UUIDv4 generated on device
      device_derived: false
      purpose: [session_history, data_deletion, data_export, experiment_assignment]
      deletable: true
      advertising_use: false
  wellness:
    check_in:
      collected: true
      fields: [goal, stress, energy, mental_activity, sleepiness, available_minutes, experience_level]
      purpose: [practice_recommendation, personalization]
      deletable: true
      advertising_use: false
    session_history:
      collected: true
      purpose: [history, personalization, product_analytics]
      deletable: true
      advertising_use: false
    feedback:
      collected: true
      fields:
        - after_score
        - helpfulness
        - completed
        - notes
        - stress_after
        - energy_after
        - mental_activity_after
        - sleepiness_after
        - completion_ratio
      purpose: [outcome_measurement, personalization, quality_improvement]
      deletable: true
      advertising_use: false
    outcome_evidence:
      collected: true
      derived_from: [check_in, feedback]
      fields: [primary_measure, primary_delta, secondary_measure, secondary_delta, outcome_score]
      purpose: [product_optimization]
      clinical_use: false
      diagnostic_use: false
      shown_to_user: false
      deletable: true
      advertising_use: false
      notes: >-
        outcome_score is a product optimization metric only. It is not a
        clinical, medical or diagnostic score, it is not validated, and it is
        never displayed. Raw before and after values are retained so every
        derived value stays recomputable.
    experiment_assignment:
      collected: true
      fields: [experiment_id, variant, assignment_key, assigned_at]
      purpose: [product_experimentation]
      deterministic: true
      deletable: true
      advertising_use: false
    local_playback_checkpoint:
      # Not "collected" in the Apple or Google sense: nothing here is
      # transmitted to or gathered by the developer. The form that does leave
      # the device is declared as playback_journal below and mapped in both
      # store documents. Declaring this separately as collected would describe
      # a second data flow that does not exist.
      collected: false
      stored: on_device_only
      fields: [session_id, plan_hash, resolution_hash, audio_mode, run_state,
               command_sequence, logical_position_ms, confirmed_segment_id,
               pause_reason]
      purpose: [session_resume, offline_delivery]
      deletable: true
      advertising_use: false
      notes: >-
        A durable local record of where a session got to, so a session played
        offline can be resumed after the process is killed. Never leaves the
        device except as the playback events already declared below. Cleared on
        guest deletion, which also writes a local tombstone so a late response
        cannot recreate it. No monotonic clock value is stored - a stopwatch
        reading means nothing across a reboot.
    local_outbox:
      # Same reasoning: the outbox holds copies of requests that have not yet
      # been sent. Once sent they are the already-declared playback events; an
      # unsent copy on the user's own device is not an additional collection.
      collected: false
      stored: on_device_only
      fields: [session_id, kind, command_id, sequence, payload, attempts]
      purpose: [reliable_delivery]
      deletable: true
      advertising_use: false
      notes: >-
        Operations not yet acknowledged by the backend. Holds the same content
        the API would have received, queued until it can be sent. Bounded by
        explicit row and byte quotas and cleared on guest deletion.
    playback_journal:
      collected: true
      fields: [sequence, event_type, segment_id, elapsed_ms, command_id, occurred_at]
      purpose: [session_resume, playback_diagnostics, outcome_measurement]
      deletable: true
      advertising_use: false
      append_only: true
      notes: >-
        What happened during a session: which segment was reached, when it was
        paused, whether it was interrupted. elapsed_ms is playback position, not
        wall-clock duration. No spoken text and no transcript is stored in the
        journal - the words live in the frozen session definition, which is not
        guest-linked. Append-only against rewriting, which does not affect
        deletion: the rows go with the guest cascade like everything else.
    session_definition:
      collected: false
      shared_across_guests: true
      notes: >-
        The frozen guidance text a session used, addressed by the hash of its
        own content. Product-authored and identical for every user, so it is not
        personal data and is deliberately not guest-linked. It survives guest
        deletion because there is nothing personal in it to delete, and because
        deleting it would break the reproducibility of sessions other people
        still hold.
    audio_render:
      collected: false
      shared_across_guests: true
      notes: >-
        Measured audio for one utterance, keyed by the hash of its render
        inputs. Records which content was rendered, never who heard it: the
        table has no guest column. Not cleared by guest deletion, for the same
        reason as the session definition.
    # Program005. Two preferences with two different data flows, declared
    # separately because one leaves the device and one does not.
    adaptive_wording_preference:
      collected: true
      stored: on_device_and_server
      fields: [adaptive_wording_enabled]
      purpose: [personalization]
      deletable: true
      advertising_use: false
      notes: >-
        One boolean, default true, kept in the app's local database. The
        stored value is SENT with every session-create request, and the value
        the server applied is STORED in sessions.personalization and included
        in the data export. It is therefore collected, linked to the guest id
        like the session it belongs to, and deleted with the guest cascade.
    reminder_preference:
      collected: false
      stored: on_device_only
      fields: [reminder_enabled, reminder_hour, reminder_minute, reminder_zone]
      purpose: [local_reminder]
      deletable: true
      advertising_use: false
      notes: >-
        Whether a daily reminder is on, at what time, in which time zone.
        Never sent to the backend; nothing about the reminder appears in any
        request. Erased by the local deletion procedure, which also cancels
        the OS schedule. Backup: on Android the app opts out of backup and
        device transfer entirely; on iOS the database lives in Application
        Support, which the OS includes in device backups, so a restore to a
        new device can bring this row back. That is stated rather than denied.
    personalization_provenance:
      collected: true
      derived_from: [session_history, adaptive_wording_preference]
      fields: [personalization_policy_version, familiarity_tier, evidence_count,
               evidence_capped, presentation_variant, adaptive_wording_enabled,
               personalized, provider_id, ai_attempted, ai_accepted,
               fallback_reason, reason]
      purpose: [personalization, explainability]
      shown_to_user: reason_and_variant_only
      deletable: true
      advertising_use: false
      notes: >-
        Written once when a session is created and never updated: which
        opening wording was used and why. familiarity_tier is derived from a
        bounded count of this guest's completed sessions of the same practice
        (0 -> new, 1 or more -> returning) and infers nothing else - no trait,
        no diagnosis, no outcome. No score of any kind is in it. Exported with
        the session and deleted with the guest cascade.
  health:
    healthkit:
      collected: false
      deferred_to: Program008
    health_connect:
      collected: false
      deferred_to: Program008
    garmin:
      collected: false
      deferred_to: Program008
  sensors:
    camera:
      permission_required: false
    microphone:
      permission_required: false
      notes: >-
        Program004 plays audio; it never captures any. Text-to-speech is output
        only and requires no microphone permission on either platform.
    location:
      permission_required: false
  audio:
    background_playback:
      permission_required: true
      data_collected: false
      notes: >-
        Guidance continues while the screen is off. iOS UIBackgroundModes=audio;
        Android media-playback foreground service. Declared because the code
        creates the fact, and it collects nothing.
    text_to_speech:
      provider: device-native
      cloud_subprocessor: false
      user_data_in_request: false
      notes: >-
        Synthesis requests carry product-authored text and a voice identity and
        nothing else. No guest id, session id, experiment arm, device id,
        history or free text ever reaches a renderer, and that is enforced by a
        check over the serialised request rather than by review. On Android the
        system TTS engine may itself synthesise over the network, outside the
        app's control and unobservable to it; that is an OS-level behaviour and
        is disclosed as one.
  ai:
    user_text_to_generation:
      enabled: planned
      safety_router_required: true
      report_output_required: true
    presentation_rewrite:
      # Program005: the path exists and is exercised with the null provider;
      # no vendor is engaged and no generative model is called.
      path_enabled: true
      provider_engaged: none
      external_call: false
      request_contents: [practice_id, duration_minutes, guidance_density,
                         stage_prompt_templates, presentation_variant]
      request_never_contains: [guest_id, session_id, check_in_values, history,
                               experiment_arm, feedback, notes, free_text,
                               device_id]
      guarded_by: envelope_and_wording_guard
      notes: >-
        A future provider may restate the first stage's wording only, inside
        the guard; any other change is discarded. The null provider returns
        the deterministic wording and is not counted as AI use.
  rights:
    deletion:
      self_service: true
      endpoint: "DELETE /v1/me/data"
      scope: all guest-owned rows, by database cascade
    export:
      self_service: true
      endpoint: "GET /v1/me/export"
      format: json
  commerce:
    apple_iap: planned
    google_play_billing: planned
    entitlement_service: required
