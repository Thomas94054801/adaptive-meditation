schema_version: 1
product_positioning: wellness
medical_diagnosis: false
medical_treatment_claims: false
individual_first: true
v1:
  identity:
    email:
      collected: optional
      purpose: [account, authentication]
      deletable: true
      advertising_use: false
  identity_guest:
    guest_id:
      collected: true
      form: random UUIDv4 generated on device
      device_derived: false
      purpose: [session_history, data_deletion, data_export, experiment_assignment]
      deletable: true
      advertising_use: false
  wellness:
    check_in:
      collected: true
      fields: [goal, stress, energy, mental_activity, sleepiness, available_minutes, experience_level]
      purpose: [practice_recommendation, personalization]
      deletable: true
      advertising_use: false
    session_history:
      collected: true
      purpose: [history, personalization, product_analytics]
      deletable: true
      advertising_use: false
    feedback:
      collected: true
      fields:
        - after_score
        - helpfulness
        - completed
        - notes
        - stress_after
        - energy_after
        - mental_activity_after
        - sleepiness_after
        - completion_ratio
      purpose: [outcome_measurement, personalization, quality_improvement]
      deletable: true
      advertising_use: false
    outcome_evidence:
      collected: true
      derived_from: [check_in, feedback]
      fields: [primary_measure, primary_delta, secondary_measure, secondary_delta, outcome_score]
      purpose: [product_optimization]
      clinical_use: false
      diagnostic_use: false
      shown_to_user: false
      deletable: true
      advertising_use: false
      notes: >-
        outcome_score is a product optimization metric only. It is not a
        clinical, medical or diagnostic score, it is not validated, and it is
        never displayed. Raw before and after values are retained so every
        derived value stays recomputable.
    experiment_assignment:
      collected: true
      fields: [experiment_id, variant, assignment_key, assigned_at]
      purpose: [product_experimentation]
      deterministic: true
      deletable: true
      advertising_use: false
  health:
    healthkit:
      collected: false
      deferred_to: Program008
    health_connect:
      collected: false
      deferred_to: Program008
    garmin:
      collected: false
      deferred_to: Program008
  sensors:
    camera:
      permission_required: false
    microphone:
      permission_required: false
    location:
      permission_required: false
  ai:
    user_text_to_generation:
      enabled: planned
      safety_router_required: true
      report_output_required: true
  rights:
    deletion:
      self_service: true
      endpoint: "DELETE /v1/me/data"
      scope: all guest-owned rows, by database cascade
    export:
      self_service: true
      endpoint: "GET /v1/me/export"
      format: json
  commerce:
    apple_iap: planned
    google_play_billing: planned
    entitlement_service: required
