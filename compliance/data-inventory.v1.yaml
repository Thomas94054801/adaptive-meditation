schema_version: 1
product_positioning: wellness
medical_diagnosis: false
medical_treatment_claims: false
individual_first: true
v1:
  identity:
    email:
      collected: optional
      purpose: [account, authentication]
      deletable: true
      advertising_use: false
  identity_guest:
    guest_id:
      collected: true
      form: random UUIDv4 generated on device
      device_derived: false
      purpose: [session_history, data_deletion, data_export, experiment_assignment]
      deletable: true
      advertising_use: false
  wellness:
    check_in:
      collected: true
      fields: [goal, stress, energy, mental_activity, sleepiness, available_minutes, experience_level]
      purpose: [practice_recommendation, personalization]
      deletable: true
      advertising_use: false
    session_history:
      collected: true
      purpose: [history, personalization, product_analytics]
      deletable: true
      advertising_use: false
    feedback:
      collected: true
      fields:
        - after_score
        - helpfulness
        - completed
        - notes
        - stress_after
        - energy_after
        - mental_activity_after
        - sleepiness_after
        - completion_ratio
      purpose: [outcome_measurement, personalization, quality_improvement]
      deletable: true
      advertising_use: false
    outcome_evidence:
      collected: true
      derived_from: [check_in, feedback]
      fields: [primary_measure, primary_delta, secondary_measure, secondary_delta, outcome_score]
      purpose: [product_optimization]
      clinical_use: false
      diagnostic_use: false
      shown_to_user: false
      deletable: true
      advertising_use: false
      notes: >-
        outcome_score is a product optimization metric only. It is not a
        clinical, medical or diagnostic score, it is not validated, and it is
        never displayed. Raw before and after values are retained so every
        derived value stays recomputable.
    experiment_assignment:
      collected: true
      fields: [experiment_id, variant, assignment_key, assigned_at]
      purpose: [product_experimentation]
      deterministic: true
      deletable: true
      advertising_use: false
    playback_journal:
      collected: true
      fields: [sequence, event_type, segment_id, elapsed_ms, command_id, occurred_at]
      purpose: [session_resume, playback_diagnostics, outcome_measurement]
      deletable: true
      advertising_use: false
      append_only: true
      notes: >-
        What happened during a session: which segment was reached, when it was
        paused, whether it was interrupted. elapsed_ms is playback position, not
        wall-clock duration. No spoken text and no transcript is stored in the
        journal - the words live in the frozen session definition, which is not
        guest-linked. Append-only against rewriting, which does not affect
        deletion: the rows go with the guest cascade like everything else.
    session_definition:
      collected: false
      shared_across_guests: true
      notes: >-
        The frozen guidance text a session used, addressed by the hash of its
        own content. Product-authored and identical for every user, so it is not
        personal data and is deliberately not guest-linked. It survives guest
        deletion because there is nothing personal in it to delete, and because
        deleting it would break the reproducibility of sessions other people
        still hold.
    audio_render:
      collected: false
      shared_across_guests: true
      notes: >-
        Measured audio for one utterance, keyed by the hash of its render
        inputs. Records which content was rendered, never who heard it: the
        table has no guest column. Not cleared by guest deletion, for the same
        reason as the session definition.
  health:
    healthkit:
      collected: false
      deferred_to: Program008
    health_connect:
      collected: false
      deferred_to: Program008
    garmin:
      collected: false
      deferred_to: Program008
  sensors:
    camera:
      permission_required: false
    microphone:
      permission_required: false
      notes: >-
        Program004 plays audio; it never captures any. Text-to-speech is output
        only and requires no microphone permission on either platform.
    location:
      permission_required: false
  audio:
    background_playback:
      permission_required: true
      data_collected: false
      notes: >-
        Guidance continues while the screen is off. iOS UIBackgroundModes=audio;
        Android media-playback foreground service. Declared because the code
        creates the fact, and it collects nothing.
    text_to_speech:
      provider: device-native
      cloud_subprocessor: false
      user_data_in_request: false
      notes: >-
        Synthesis requests carry product-authored text and a voice identity and
        nothing else. No guest id, session id, experiment arm, device id,
        history or free text ever reaches a renderer, and that is enforced by a
        check over the serialised request rather than by review. On Android the
        system TTS engine may itself synthesise over the network, outside the
        app's control and unobservable to it; that is an OS-level behaviour and
        is disclosed as one.
  ai:
    user_text_to_generation:
      enabled: planned
      safety_router_required: true
      report_output_required: true
  rights:
    deletion:
      self_service: true
      endpoint: "DELETE /v1/me/data"
      scope: all guest-owned rows, by database cascade
    export:
      self_service: true
      endpoint: "GET /v1/me/export"
      format: json
  commerce:
    apple_iap: planned
    google_play_billing: planned
    entitlement_service: required
