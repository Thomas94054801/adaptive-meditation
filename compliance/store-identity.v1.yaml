# Store identity gate.
#
# Bundle and application identifiers are effectively immutable once a production
# store listing exists: changing one means a new listing, a new app record and
# the loss of every review and install. They are therefore not invented here.
#
# STORE_IDENTITY_GATE blocks the creation of immutable store identity. It does
# not block engineering, and nothing in the build depends on it being resolved.
schema_version: 1
program: Program003

gate: BLOCKED_BRAND_IDENTITY

fields:
  brand_name:
    status: unresolved
    current_placeholder: adaptive_meditation
    note: >-
      A working name used in the repository and the development build. It is not
      a chosen public brand and must not be filed with either store.
  android_application_id:
    status: unresolved
    current_placeholder: com.adaptivemeditation.adaptive_meditation
    note: >-
      Generated by flutter create from the working name. Fine for a development
      build; must be replaced with com.<brand>.<product> before the first
      production upload, because it cannot be changed afterwards.
  ios_bundle_id:
    status: unresolved
    current_placeholder: com.adaptivemeditation.adaptiveMeditation
    note: Same constraint as the Android applicationId.
  support_domain:
    status: unresolved
    note: Required before the privacy policy and support URLs can be published.
  privacy_policy_url:
    status: unresolved
    implemented_route: /privacy
    note: >-
      The page exists and is served. Only the public URL is blocked, and only on
      the domain.
  support_email:
    status: unresolved
    implemented_route: /support
  user_privacy_choices_url:
    status: unresolved
    implemented_route: /privacy-choices

blocks:
  - production store submission
  - creation of an App Store Connect app record
  - creation of a Play Console app listing
  - any irreversible identifier decision

does_not_block:
  - backend and client engineering
  - release builds
  - CI
  - privacy and compliance documentation
  - internal testing
