[project]
name = "adaptive-meditation-backend"
version = "0.1.0"
description = "Adaptive Meditation Program001 backend - deterministic practice recommendation vertical slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6,<0.116",
  "uvicorn[standard]>=0.34.0,<0.35",
  "pydantic>=2.10.4,<3",
  "pydantic-settings>=2.7.0,<3",
  "sqlalchemy>=2.0.36,<2.1",
  "alembic>=1.14.0,<2",
  "psycopg[binary]>=3.2.3,<4",
  "pyyaml>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4,<9",
  "httpx>=0.28.1,<0.29",
  "ruff>=0.8.4,<0.9",
  "mypy>=1.14.0,<2",
  "types-pyyaml>=6.0.12,<7",
  "openapi-spec-validator>=0.7.1,<0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = []
warn_unused_ignores = true
disallow_untyped_decorators = false
